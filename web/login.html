<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — HOA Connect</title>
  <link rel="stylesheet" href="/css/app.css">
  <!-- Hide body until mode check completes so the login form never flashes in test mode -->
  <style>body { visibility: hidden; }</style>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <svg width="68" height="68" viewBox="0 0 68 68" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="68" height="68" rx="18" fill="#0D9488"/>
        <rect width="68" height="68" rx="18" fill="url(#logoGrad)" opacity="0.4"/>
        <path d="M34 13L16 27h4v22h12v-11h4v11h12V27h4L34 13z" fill="white"/>
        <defs>
          <linearGradient id="logoGrad" x1="0" y1="0" x2="68" y2="68" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#5EEAD4"/>
            <stop offset="100%" stop-color="#0F766E"/>
          </linearGradient>
        </defs>
      </svg>
      <h1>HOA Connect</h1>
      <p>Community Management Portal</p>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input id="username" type="text" class="form-control" placeholder="Enter username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input id="password" type="password" class="form-control" placeholder="Enter password" autocomplete="current-password" required>
      </div>

      <p id="login-error" class="form-error" style="margin-bottom:12px;min-height:18px;"></p>

      <button id="login-btn" type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">
        Sign In
      </button>
    </form>
  </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
